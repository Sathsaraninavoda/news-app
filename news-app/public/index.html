<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News App - Search Latest News</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 News App</h1>
            <p>Search for the latest news articles from around the world</p>
        </header>

        <div class="search-section">
            <form id="searchForm" class="search-form">
                <div class="form-group">
                    <label for="keyword">Keyword *</label>
                    <input 
                        type="text" 
                        id="keyword" 
                        name="keyword" 
                        placeholder="e.g., technology, sports, politics"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input 
                            type="date" 
                            id="date" 
                            name="date"
                        >
                    </div>

                    <div class="form-group">
                        <label for="language">Language</label>
                        <select id="language" name="language">
                            <option value="">All Languages</option>
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="ru">Russian</option>
                            <option value="zh">Chinese</option>
                            <option value="ja">Japanese</option>
                            <option value="ar">Arabic</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="search-btn">Search News</button>
            </form>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading news articles...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="results" class="results">
            <div id="resultsInfo" class="results-info hidden"></div>
            <div id="articlesContainer" class="articles-container"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
